<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#08080B"/>
  <!-- T shape (left side, white) -->
  <!-- crossbar of T -->
  <rect x="8" y="14" width="22" height="7" rx="3.5" fill="#FFFFFF"/>
  <!-- stem of T -->
  <rect x="15" y="14" width="8" height="36" rx="3" fill="#FFFFFF"/>
  <!-- f shape (right side, blue) -->
  <!-- stem of f -->
  <rect x="38" y="20" width="8" height="30" rx="3" fill="#0052FF"/>
  <!-- crossbar of f -->
  <rect x="34" y="31" width="16" height="6" rx="3" fill="#0052FF"/>
  <!-- curved top of f -->
  <path d="M46 20 C46 14 56 14 56 20" stroke="#0052FF" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
